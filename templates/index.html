<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>hanni♡</title>
    <link rel="stylesheet" href="/static/app.css?v={{ static_version }}" />
  </head>
  <body>
    <main class="shell">
      <header class="brand">
        <a class="brand-link" href="/" aria-label="hanni home">
          <h1>hanni<span aria-hidden="true">♡</span></h1>
        </a>
      </header>

      <nav class="surface-nav" aria-label="Browse style">
        <span aria-current="page">feed</span>
        <a href="/sets">sets</a>
        <a href="/scroll">scroll</a>
      </nav>

      <form id="feed-form" class="search feed-search" role="search">
        <label class="sr-only" for="query">Search by member or group</label>
        <input id="query" name="query" type="search" placeholder="search a member or group" autocomplete="off" />
        <label class="sr-only" for="sort">Sort feed</label>
        <select id="sort" name="sort" aria-label="Sort feed">
          <option value="random" selected>random</option>
          <option value="top">top</option>
        </select>
        <button type="submit">Search</button>
      </form>

      <div id="collection-heading" class="collection-heading" hidden></div>
      <section id="feed" class="feed-list" aria-live="polite" aria-label="Content feed"></section>
      <div id="feed-sentinel" class="feed-sentinel" role="status" aria-live="polite" aria-label="More content loading"></div>
      <p id="status" class="feed-status" role="status" aria-live="polite" hidden></p>
      <div id="timeline-tools" class="timeline-tools" aria-label="Timeline controls" hidden>
        <button id="timeline-search" type="button" aria-label="Open search"><svg class="timeline-icon timeline-icon-search" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="10.25" cy="10.25" r="5.65"></circle><path d="m14.25 14.25 4.85 4.85"></path></svg></button>
        <button id="timeline-refresh" type="button" aria-label="Refresh timeline"><svg class="timeline-icon timeline-icon-refresh" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M19 7.75a7.25 7.25 0 1 0 .1 8.1"></path><path d="M19 3.75v4h-4"></path></svg></button>
        <button id="timeline-top" type="button" aria-label="Jump to top"><svg class="timeline-icon timeline-icon-top" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 19V5"></path><path d="m6.75 10.25 5.25-5.25 5.25 5.25"></path></svg></button>
      </div>
    </main>
    <footer class="site-credit">made by glaceon</footer>
    <script src="/static/analytics.js?v={{ static_version }}" defer></script>
    <script src="/static/app.js?v={{ static_version }}" defer></script>
  </body>
</html>
