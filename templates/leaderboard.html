<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    {% include "_social_meta.html" %}
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="K-pop idol leaderboard — global ELO consensus and your own sorter ranking ♡" />
    <title>leaderboard ♡ · hanni</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext x='32' y='46' text-anchor='middle' font-size='44' fill='%23b84d79'%3E%E2%99%A1%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/static/nav.css?v={{ static_version }}" />
    <link rel="stylesheet" href="/static/leaderboard.css?v={{ static_version }}" />
  </head>
  <body>
    {% set active = "leaderboard" %}{% include "_nav.html" %}
    <main class="shell">
      <header class="masthead">
        <h1>leaderboard <span>♡</span></h1>
      </header>
      <div class="controls">
        <div class="tabs" role="group" aria-label="Leaderboard scope">
          <button data-scope="global" aria-pressed="true">Global</button>
          <button data-scope="personal" aria-pressed="false">Mine</button>
        </div>
        <div class="subtabs" role="group" aria-label="Leaderboard kind">
          <button data-kind="idols" aria-pressed="true">Idols</button>
          <button data-kind="groups" aria-pressed="false">Groups</button>
        </div>
      </div>
      <section id="board" aria-live="polite" aria-label="Leaderboard"></section>
    </main>
    <footer class="site-foot"><span>made by glaceon</span><a href="/sorter">sorter →</a></footer>
    <div id="toast" role="status" hidden></div>
    <script src="/static/sorter/engine.js?v={{ static_version }}" defer></script>
    <script src="/static/leaderboard.js?v={{ static_version }}" defer></script>
  </body>
</html>
