<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    {% include "_social_meta.html" %}
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Every idol portrait in the bias sorter, in one pretty wall ♡" />
    <title>idol photos ♡ · hanni</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext x='32' y='46' text-anchor='middle' font-size='44' fill='%23b84d79'%3E%E2%99%A1%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/static/nav.css?v={{ static_version }}" />
    <link rel="stylesheet" href="/static/photos.css?v={{ static_version }}" />
  </head>
  <body>
    {% set active = "sorter" %}{% include "_nav.html" %}
    <main class="shell">
      <header class="masthead">
        <h1>idol photos <span>♡</span></h1>
        <p class="standfirst">Every portrait in the sorter, in one wall. Pink dot = saved on our server, grey = Discord copy, hollow = original web address.</p>
      </header>
      <div class="controls">
        <label class="search"><span aria-hidden="true">⌕</span><input
            id="search"
            type="search"
            placeholder="Search idols or groups"
            aria-label="Search photos"
          ></label>
        <p id="stats" class="stats" aria-live="polite">gathering photos…</p>
      </div>
      <section id="wall" aria-live="polite" aria-label="Idol photos"></section>
    </main>
    <footer class="site-foot"><span>made by glaceon</span><a href="/sorter">sorter →</a></footer>
    <div id="toast" role="status" hidden></div>
    <script src="/static/photos.js?v={{ static_version }}" defer></script>
  </body>
</html>
