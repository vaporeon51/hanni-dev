<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>scroll · hanni♡</title>
    <link rel="stylesheet" href="/static/app.css?v={{ static_version }}" />
    <link rel="stylesheet" href="/static/scroll.css?v={{ static_version }}" />
  </head>
  <body class="scroll-page">
    <header class="scroll-topbar">
      <a class="scroll-brand" href="/" aria-label="hanni home">hanni<span aria-hidden="true">♡</span></a>
      <nav class="scroll-nav" aria-label="Browse style">
        <a href="/">feed</a>
        <a href="/sets">sets</a>
        <span aria-current="page">scroll</span>
      </nav>
      <form id="scroll-form" class="scroll-search" role="search">
        <label class="sr-only" for="query">Filter by idol or group</label>
        <svg class="scroll-filter-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M4 5h16l-6.25 7.1v5.15l-3.5 1.75v-6.9L4 5Z"></path>
        </svg>
        <input
          id="query"
          name="query"
          type="search"
          placeholder="idol or group"
          autocomplete="off"
          autocapitalize="none"
          autocorrect="off"
          spellcheck="false"
          enterkeyhint="search"
        />
        <button type="submit" aria-label="Filter reels">
          <span class="scroll-search-label">go</span>
          <svg class="scroll-search-icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="6.5"></circle>
            <path d="m16 16 4 4"></path>
          </svg>
        </button>
      </form>
    </header>

    <main id="reel-feed" class="reel-feed" aria-live="polite" aria-label="Scrolling content feed"></main>
    <div id="scroll-status" class="scroll-status" role="status" aria-live="polite" hidden></div>
    <button id="scroll-top" class="scroll-top" type="button" aria-label="Return to first reel" hidden>↑ top</button>
    <div class="scroll-controls">
      <button id="view-toggle" class="view-toggle" type="button" aria-pressed="false" aria-label="Collage mode: off">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <rect x="4" y="4" width="7" height="7" rx="1.5"></rect>
          <rect x="13" y="4" width="7" height="7" rx="1.5"></rect>
          <rect x="4" y="13" width="7" height="7" rx="1.5"></rect>
          <rect x="13" y="13" width="7" height="7" rx="1.5"></rect>
        </svg>
        <span class="view-prefix" aria-hidden="true">collage:</span>
        <span id="view-state">off</span>
      </button>
    <div id="autoplay" class="autoplay" data-duration="0">
      <button id="autoplay-toggle" class="autoplay-toggle" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Autoplay next reel: off">
        <svg class="autoplay-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="8.5"></circle>
          <path d="M12 7.5V12l3 2"></path>
        </svg>
        <span class="autoplay-prefix" aria-hidden="true">autoplay:</span>
        <span id="autoplay-label" class="autoplay-label">off</span>
      </button>
      <div id="autoplay-menu" class="autoplay-menu" role="radiogroup" aria-label="Autoplay interval" hidden>
        <button type="button" role="radio" data-duration="0" aria-checked="true">off</button>
        <button type="button" role="radio" data-duration="5000" aria-checked="false">5s</button>
        <button type="button" role="radio" data-duration="10000" aria-checked="false">10s</button>
        <button type="button" role="radio" data-duration="20000" aria-checked="false">20s</button>
      </div>
    </div>
    </div>
    <div id="lightbox" class="lightbox" hidden>
      <div class="lightbox-backdrop" data-lightbox-close></div>
      <figure class="lightbox-panel" role="dialog" aria-modal="true" aria-label="Expanded reel">
        <button id="lightbox-close" class="lightbox-close" type="button" aria-label="Close expanded view">✕</button>
        <div id="lightbox-stage" class="lightbox-stage"></div>
        <div class="lightbox-caption">
          <div class="reel-title-row"><button id="lightbox-title" class="reel-title" type="button" data-filter-query=""></button><a id="lightbox-collection" class="reel-collection-link" hidden></a></div>
          <div id="lightbox-meta" class="reel-meta"></div>
          <p id="lightbox-message" class="reel-message"></p>
        </div>
        <div id="lightbox-actions" class="lightbox-actions"></div>
      </figure>
    </div>

    <script src="/static/analytics.js?v={{ static_version }}" defer></script>
    <script src="/static/scroll.js?v={{ static_version }}" defer></script>
  </body>
</html>
