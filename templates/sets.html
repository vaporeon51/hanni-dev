<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>sets · hanni♡</title>
    <link rel="stylesheet" href="/static/app.css?v={{ static_version }}" />
  </head>
  <body>
    <main class="shell">
      <header class="brand">
        <a class="brand-link" href="/" aria-label="hanni home">
          <h1>hanni<span aria-hidden="true">♡</span></h1>
        </a>
      </header>

      <nav class="surface-nav" aria-label="Browse style">
        <a href="/">links</a>
        <span aria-current="page">sets</span>
      </nav>

      <form id="sets-form" class="search" role="search">
        <label class="sr-only" for="query">Search sets by member or group</label>
        <input id="query" name="query" type="search" placeholder="search sets by member or group" autocomplete="off" />
        <label class="sr-only" for="sort">Sort sets</label>
        <select id="sort" name="sort" aria-label="Sort sets">
          <option value="random" selected>random</option>
          <option value="latest">latest</option>
          <option value="oldest">oldest</option>
          <option value="top">top</option>
        </select>
        <label class="sr-only" for="limit">Number of sets</label>
        <select id="limit" name="limit" aria-label="Number of sets">
          <option value="1">1 set</option>
          <option value="15" selected>15 sets</option>
          <option value="30">30 sets</option>
        </select>
        <button type="submit">Search</button>
      </form>

      <section id="feed" class="feed-list" aria-live="polite" aria-label="Content sets"></section>
      <div class="feed-status" aria-live="polite" hidden>
        <span class="feed-status-line">
          <span id="status" hidden></span>
          <button id="jump-top" class="jump-top" type="button" aria-label="Jump to top" hidden>↑ top</button>
          <button id="jump-bottom" class="jump-bottom" type="button" aria-label="Jump to bottom" hidden>↓ bottom</button>
          <button id="stop-feed" class="stop-feed" type="button" hidden>stop</button>
        </span>
        <span id="reveal-progress" class="reveal-progress" hidden aria-hidden="true"><span></span></span>
      </div>
    </main>
    <footer class="site-credit">made by glaceon</footer>
    <script src="/static/sets.js?v={{ static_version }}" defer></script>
  </body>
</html>
