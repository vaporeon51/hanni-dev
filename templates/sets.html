<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>sets · hanni♡</title>
    <link rel="stylesheet" href="/static/app.css?v={{ static_version }}" />
  </head>
  <body>
    <main class="shell">
      <header class="brand">
        <a class="brand-link" href="/" aria-label="hanni home">
          <h1>hanni<span aria-hidden="true">♡</span></h1>
        </a>
      </header>

      <nav class="surface-nav" aria-label="Browse style">
        <a href="/">feed</a>
        <span aria-current="page">sets</span>
        <a href="/scroll">scroll</a>
      </nav>

      <form id="sets-form" class="search sets-search" role="search">
        <label class="sr-only" for="query">Search sets by member or group</label>
        <input id="query" name="query" type="search" placeholder="search sets by member or group" autocomplete="off" />
        <label class="sr-only" for="sort">Sort sets</label>
        <select id="sort" name="sort" aria-label="Sort sets">
          <option value="latest" selected>newest</option>
          <option value="oldest">oldest</option>
        </select>
        <button type="submit">Search</button>
      </form>

      <section id="feed" class="feed-list" aria-live="polite" aria-label="Content sets"></section>
      <div id="feed-sentinel" class="feed-sentinel" role="status" aria-live="polite" aria-label="More sets loading"></div>
      <p id="status" class="feed-status" role="status" aria-live="polite" hidden></p>
      <div id="timeline-tools" class="timeline-tools" aria-label="Timeline controls" hidden>
        <button id="timeline-search" type="button" aria-label="Open search"><svg class="timeline-icon timeline-icon-search" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="10" cy="10" r="6.25"></circle><path d="M15.05 15.05 20.4 20.4"></path></svg></button>
        <button id="timeline-refresh" type="button" aria-label="Refresh timeline"><span class="timeline-icon" aria-hidden="true">↻</span></button>
        <button id="timeline-top" type="button" aria-label="Jump to top"><span class="timeline-icon" aria-hidden="true">↑</span></button>
      </div>
    </main>
    <footer class="site-credit">made by glaceon</footer>
    <script src="/static/analytics.js?v={{ static_version }}" defer></script>
    <script src="/static/sets.js?v={{ static_version }}" defer></script>
  </body>
</html>
