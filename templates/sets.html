<!doctype html>
<html lang="en" class="age-gate-pending">
  <head>
    <meta charset="utf-8" />
    {% include "_social_meta.html" %}
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>sets · hanni♡</title>
    <link rel="stylesheet" href="/static/nav.css?v={{ static_version }}" />
    <link rel="stylesheet" href="/static/app.css?v={{ static_version }}" />
    <link rel="stylesheet" href="/static/nsfw.css?v={{ static_version }}" />
  </head>
  <body class="nsfw">
    {% set active = "sets" %}{% include "_nav.html" %}
    <main class="shell">
      <form id="sets-form" class="search sets-search" role="search">
        <label class="sr-only" for="query">Search sets by member, group, or link</label>
        <input id="query" name="query" type="search" placeholder="search sets by member, group, or link" autocomplete="off" />
        <label class="sr-only" for="sort">Sort sets</label>
        <select id="sort" name="sort" aria-label="Sort sets">
          <option value="latest" selected>newest</option>
          <option value="oldest">oldest</option>
        </select>
        <button type="submit">Search</button>
      </form>

      <section id="feed" class="feed-list" aria-live="polite" aria-label="Content sets"></section>
      <div id="feed-sentinel" class="feed-sentinel" role="status" aria-live="polite" aria-label="More sets loading"></div>
      <p id="status" class="feed-status" role="status" aria-live="polite" hidden></p>
      <div id="timeline-tools" class="timeline-tools" aria-label="Timeline controls" hidden>
        <button id="timeline-search" type="button" aria-label="Open search"><svg class="timeline-icon timeline-icon-search" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="10.25" cy="10.25" r="5.65"></circle><path d="m14.25 14.25 4.85 4.85"></path></svg></button>
        <button id="timeline-top" type="button" aria-label="Jump to top"><svg class="timeline-icon timeline-icon-top" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 19V5"></path><path d="m6.75 10.25 5.25-5.25 5.25 5.25"></path></svg></button>
      </div>
    </main>
    <footer class="site-credit">made by glaceon</footer>
    <script src="/static/analytics.js?v={{ static_version }}" defer></script>
    {% include "_age_gate.html" %}
    <script src="/static/age-gate.js?v={{ static_version }}" data-page-script="/static/sets.js?v={{ static_version }}" defer></script>
  </body>
</html>
